/* chaos-to-rails (6 s, hero) — "The agent keeps going; the rails keep it honest."

    events: [{ t: 1.45, type: 'slam' }, { t: 3.2, type: 'chime', n: 0 }, { t: 3.9, type: 'chime', n: 2 }],
    build(root) {
      const g = el('g', {}, root);
      el('rect', { width: 1000, height: 560, fill: C.bg }, g);
      const glow = glowFilter(g, 3);

      const r = rail(g, { x0: A.x + A.w, x1: O.x, y: Y });
      const trail = el('line', { y1: Y, y2: Y, x1: A.x + A.w, stroke: C.accent, 'stroke-width': 4, 'stroke-linecap': 'round' }, g);

      const node = (n, label) => {
        const ng = el('g', {}, g);
        const box = el('rect', { x: n.x + 0.5, y: Y - 49.5, width: n.w - 1, height: 99, rx: 10, fill: C.panel, stroke: C.line2 }, ng);
        const lit = el('rect', { x: n.x + 0.5, y: Y - 49.5, width: n.w - 1, height: 99, rx: 10, fill: 'none', stroke: C.accent, 'stroke-width': 2, opacity: 0 }, ng);
        const te = txt(ng, n.x + n.w / 2, Y + 8, label, { anchor: 'middle' });
        return { ng, box, lit, te };
      };
      const push = node(A, 'your push');

      const gt = gate(g, { x: GX, y: Y });
      txt(g, GX, Y + 64, 'gate', { fill: C.muted, anchor: 'middle' });
      const rej = txt(g, GX, Y + 130, '✗ rejected — origin never saw it', { fill: C.fail, anchor: 'middle', weight: 600 });

      const red = el('circle', { r: 10, cy: Y, fill: C.fail }, g);

      return {

          const out = travel(prog(t, 0.6, 1.5)), back = arrive(prog(t, 1.5, 2.15));

          const hit = prog(t, 1.45, 1.52);
          const close = arrive(prog(t, 1.3, 1.48)) * (1 - arrive(prog(t, 2.5, 2.75)));
          gt.seek({ close, red: hit * (1 - prog(t, 2.5, 2.6)) });
          r.seek({ red: linear(prog(t, 1.48, 1.9)) * (1 - arrive(prog(t, 2.4, 2.7))), gx: GX, glow: 0.35 });
          const ru = arrive(prog(t, 1.55, 1.85)) * (1 - prog(t, 2.6, 2.8));
          set(rej, { opacity: ru, transform: `translate(0,${(1 - ru) * 10})` });
          // origin stays dark while the red one is around: it never saw it
          set(origin.te, { opacity: 1 - 0.55 * prog(t, 1.5, 1.7) * (1 - prog(t, 2.6, 2.8)) });

          // green commit: all the way to origin
          const gu = travel(prog(t, 2.85, 3.9));
          const gx = lerp(A.x + A.w + 20, O.x - 6, gu);
          show(green, t > 2.7 && t < 4.0);
          set(green, { cx: gx, opacity: prog(t, 2.7, 2.85) * (1 - prog(t, 3.85, 3.95)) });

/* Showreel soundtrack — rendered offline in the page (OfflineAudioContext), 120 BPM, A minor.
 * Sound follows picture: every cut, gate slam, test flip and green light is a cue from the scenes.
 * Deterministic: noise comes from the seeded PRNG, nothing depends on wall-clock time. */
var REEL;

async function renderSoundtrack(cues, dur, bpm) {
  const SR = 48000, B = 60 / bpm;
  const ctx = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const R = rng(1210);

  const bus = ctx.createGain();
  bus.gain.setValueAtTime(0.9, 0);
  bus.gain.setValueAtTime(0.9, dur - 0.5);
  bus.gain.linearRampToValueAtTime(0, dur);
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
  bus.connect(comp).connect(ctx.destination);

  // music sits under a sidechain-style duck on every kick
  const music = ctx.createGain();
  music.connect(bus);
  const nbuf = ctx.createBuffer(1, SR * 2, SR);
  const nd = nbuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = R() * 2 - 1;

  const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
  const env = (g, t, a, peak, dec) => {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec);
  };
  const pan = (p, dest) => { const s = ctx.createStereoPanner(); s.pan.value = p; s.connect(dest); return s; };
  function osc(t, type, f0, f1, a, peak, dec, dest = bus, p = 0) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + a + dec * 0.6);
    env(g, t, a, peak, dec);
    o.connect(g).connect(pan(p, dest));
    o.start(t); o.stop(t + a + dec + 0.05);
  }
  function noise(t, { type = 'highpass', f = 8000, f1 = f, q = 0.7, a = 0.001, peak = 0.2, dec = 0.05, dest = bus, p = 0 }) {
    const s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = nbuf; fl.type = type; fl.Q.value = q;
    fl.frequency.setValueAtTime(f, t);
    if (f1 !== f) fl.frequency.exponentialRampToValueAtTime(f1, t + a + dec);
    env(g, t, a, peak, dec);
    s.connect(fl).connect(g).connect(pan(p, dest));
    s.start(t, R() * 0.9); s.stop(t + a + dec + 0.05);
  }
  const duck = (t) => {
    music.gain.setValueAtTime(1, t);
    music.gain.linearRampToValueAtTime(0.45, t + 0.01);
    music.gain.linearRampToValueAtTime(1, t + 0.22);
  };

  const kick = (t, v = 1) => { osc(t, 'sine', 150, 42, 0.002, 0.95 * v, 0.34); duck(t); };
  const hat = (t, v = 1, p = 0.25) => noise(t, { f: 8500, peak: 0.07 * v, dec: 0.04, p });
  const clap = (t) => { for (const d of [0, 0.011, 0.023]) noise(t + d, { type: 'bandpass', f: 1700, q: 1.2, peak: 0.22, dec: 0.12 }); };
  const boom = (t) => { osc(t, 'sine', 70, 28, 0.003, 0.9, 1.1); noise(t, { type: 'lowpass', f: 1800, f1: 120, peak: 0.35, dec: 0.5 }); duck(t); };
  const slam = (t, p = 0) => {
    osc(t, 'square', 92, 46, 0.001, 0.18, 0.18, bus, p);          // body
    noise(t, { type: 'bandpass', f: 2600, q: 2, peak: 0.32, dec: 0.07, p }); // latch
    osc(t + 0.004, 'triangle', 1480, 1400, 0.001, 0.07, 0.16, bus, p);  // metal ring
    kick(t, 0.7);
  };
  const flip = (t, n) => osc(t, 'triangle', hz(76 + n * 3), hz(76 + n * 3), 0.002, 0.06, 0.09, music, n ? 0.3 : -0.3);
  const chime = (t, midi, v = 1) => {
    osc(t, 'sine', hz(midi), hz(midi), 0.004, 0.13 * v, 0.9, music);
    osc(t, 'sine', hz(midi + 12), hz(midi + 12), 0.004, 0.04 * v, 0.5, music);
  };

  // harmony: Am – F – C – G, one chord per bar (2 s)
  const CHORDS = [[57, 60, 64], [53, 57, 60], [55, 60, 64], [55, 59, 62]];
  const ROOTS = [33, 29, 36, 31];
  for (let bar = 0; bar * 4 * B < dur; bar++) {
    const t0 = bar * 4 * B, ch = CHORDS[bar % 4];
    const outroBar = t0 >= 13 - 1e-6;
    for (const m of outroBar ? [57, 60, 64, 71] : ch) {
      for (const det of [-7, 7]) {
        const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
        o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det;
        f.type = 'lowpass'; f.frequency.setValueAtTime(t0 < 4 ? 700 : 1300, t0); f.Q.value = 0.5;
        const len = outroBar ? dur - t0 : 4 * B;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(0.022, t0 + 0.25);
        g.gain.setValueAtTime(0.022, t0 + len - 0.12);
        g.gain.linearRampToValueAtTime(0.0001, t0 + len);
        o.connect(f).connect(g).connect(pan(det > 0 ? 0.35 : -0.35, music));
        o.start(t0); o.stop(t0 + len + 0.05);
      }
    }
  }
  // bass: quarter notes from the first cut, eighths from the grid
  for (let t = 1.0; t < 13 - 1e-6; t += B / 2) {
    const eighthOff = Math.abs((t / B) % 1 - 0.5) < 1e-6;
    if (t < 4 && eighthOff) continue;
    const root = ROOTS[Math.floor(t / (4 * B)) % 4];
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = hz(root + 12);
    f.type = 'lowpass'; f.Q.value = 5;
    f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(140, t + 0.18);
    env(g, t, 0.004, 0.16, 0.2);
    o.connect(f).connect(g).connect(music);
    o.start(t); o.stop(t + 0.3);
  }
  // drums: kick on every beat 1–13, hats + clap from the grid
  for (let t = 1.0; t < 13 - 1e-6; t += B) {
    kick(t, t < 4 ? 0.8 : 1);
    if (t >= 4) {
      hat(t + B / 2, 1, 0.25);
      if (Math.round((t - 4) / B) % 2 === 1) clap(t);
    } else hat(t + B / 2, 0.5, -0.2);
  }
  for (let t = 9.0; t < 13 - 1e-6; t += B / 4) hat(t, 0.35, -0.3); // tension 16ths under the agent scene
  noise(3.0, { type: 'bandpass', f: 300, f1: 7000, q: 1.5, a: 0.95, peak: 0.12, dec: 0.04 }); // into the grid
  noise(12.0, { type: 'bandpass', f: 300, f1: 6000, q: 1.5, a: 0.95, peak: 0.1, dec: 0.04 });  // into the outro

  const SCALE = [69, 72, 76, 79, 81, 84];
  let chimeN = 0;
  for (const c of cues) {
    if (c.type === 'riser') noise(c.t, { type: 'bandpass', f: 400, f1: 6000, q: 2, a: c.len * 0.95, peak: 0.16, dec: 0.04 });
    else if (c.type === 'tick') osc(c.t, 'sine', 2200, 2200, 0.001, 0.08, 0.03);
    else if (c.type === 'cut') boom(c.t);
    else if (c.type === 'slam') slam(c.t, (R() - 0.5) * 0.6);
    else if (c.type === 'flip') flip(c.t, c.n || 0);
    else if (c.type === 'chime') chime(c.t, SCALE[chimeN++ % SCALE.length]);
    else if (c.type === 'snap') noise(c.t, { type: 'bandpass', f: 900, f1: 3500, q: 1, a: 0.2, peak: 0.08, dec: 0.25 });
    else if (c.type === 'station') chime(c.t, [81, 84, 88][c.n], 1.3);
    else if (c.type === 'lock') { osc(c.t, 'sine', hz(45), hz(45), 0.01, 0.4, 1.4); }
  }

  const buf = await ctx.startRendering();
  return wavBase64(buf);
}

// 16-bit PCM stereo WAV, base64 (so Playwright can carry it out of the page).
function wavBase64(buf) {
  const n = buf.length, ch = buf.numberOfChannels, sr = buf.sampleRate;
  const bytes = new Uint8Array(44 + n * ch * 2), v = new DataView(bytes.buffer);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + n * ch * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, ch, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * ch * 2, true); v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, n * ch * 2, true);
  const data = [...Array(ch)].map((_, c) => buf.getChannelData(c));
  let o = 44, peak = 0;
  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) peak = Math.max(peak, Math.abs(data[c][i]));
  const gain = peak > 0.89 ? 0.89 / peak : 1; // normalise to -1 dBFS ceiling, never clip
  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++, o += 2) v.setInt16(o, Math.round(clamp(data[c][i] * gain, -1, 1) * 32767), true);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

/* showreel (15 s, 1920×1080, 120 BPM → one beat = 0.5 s)
 * "The agent keeps going; the rails keep it honest."
 * The reel is an edit, not new footage: it re-times the six README scenes with
 * piecewise time maps so that every cut and every gate slam lands on a beat.
 *
 *  0.0  intro    one clean rail draws and wipes in the first half of the line
 *  1.0  CUT      chaos-to-rails, full frame (chaos sped up, snap on the beat)
 *  4.0  CUT      2×2 grid; four gates slam on four consecutive beats (5.0 5.5 6.0 6.5)
 *  9.0  CUT      agent-cant-finish-red; the Stop hook slams on 10.0
 * 13.0  CUT      outro: the rail glides up, logo locks, stations light on 13.5 14.0 14.5
 */
(() => {
  const W = 1920, H = 1080, DUR = 15, BEAT = 0.5;
  const S = 1.92; // 1000×560 scene → 1920×1075
  const CUTS = [1.0, 4.0, 9.0, 13.0];

  // Clip = scene instance + time map (reel t → scene t) + visible window.
  const FULL = [
    // chaos plays at 1.0× from 0.6 s: keeps its 12 fps steps on the 60 fps frame grid (no blur ghosts)
    { name: 'chaos-to-rails', a: 1.0, b: 4.0, map: [[1.0, 0.6], [2.0, 1.6], [3.0, 3.0], [4.0, 5.25]] },
    { name: 'agent-cant-finish-red', a: 9.0, b: 13.0, map: [[9.0, 0.25], [10.0, 2.0], [12.0, 5.4], [13.0, 6.6]] },
  ];
  // Grid: local = reel - offset, offsets chosen so the gates fall on 5.0 / 5.5 / 6.0 / 6.5.
  const GRID = [
    { name: 'secret-blocked', off: 5.0 - 2.22 },
    { name: 'red-push-blocked', off: 5.5 - 1.92 },
    { name: 'bypass-blocked', off: 6.0 - 1.1 },
    { name: 'local-gate', off: 6.5 - 1.45 },
  ].map((c, i) => ({ ...c, a: 4.0, b: 9.0, map: [[c.off, 0], [c.off + 20, 20]], i }));
  const CELL = 0.93, GAP_X = 20, GAP_Y = (H - 2 * 560 * CELL) / 3;
  const cellPos = (i) => [GAP_X + (i % 2) * (1000 * CELL + GAP_X), GAP_Y + Math.floor(i / 2) * (560 * CELL + GAP_Y)];

  const sceneT = (c, t) => clamp(remap(c.map, t), 0, SCENES[c.name].dur - (SCENES[c.name].xf || 0) - 0.01);

  // Every sound cue, derived from the picture.
  function cues() {
    const out = [{ t: 0, type: 'riser', len: 1.0 }];
    for (let k = 0; k < 4; k++) out.push({ t: k * 0.25, type: 'tick' });
    CUTS.forEach((t) => out.push({ t, type: 'cut' }));
    for (const c of [...FULL, ...GRID]) {
      for (const e of SCENES[c.name].events || []) {
        const rt = unmap(c.map, e.t);
        if (rt != null && rt >= c.a && rt < c.b) out.push({ ...e, t: rt });
      }
    }
    [13.5, 14.0, 14.5].forEach((t, n) => out.push({ t, type: 'station', n }));
    out.push({ t: 13.5, type: 'lock' });
    return out.sort((x, y) => x.t - y.t);
  }

  REEL = {
    w: W, h: H, dur: DUR, bpm: 120, poster: 14.8, cues,
    build(root) {
      el('rect', { width: W, height: H, fill: C.bg }, root);
      const glow = glowFilter(root, 3);

      // ── intro: the rail is the wipe that writes the line ──────────────────────────
      const intro = el('g', {}, root);
      const RY = 2.4 + 290 * S, RX0 = 960 + (40 - 500) * S, RX1 = 960 + (960 - 500) * S;
      el('line', { x1: RX0, x2: RX1, y1: RY, y2: RY, stroke: C.line2, 'stroke-width': 4, 'stroke-linecap': 'round' }, intro);
      const iRail = el('line', { x1: RX0, y1: RY, y2: RY, stroke: C.accent, 'stroke-width': 4, 'stroke-linecap': 'round' }, intro);
      const iClip = clipRect(intro, RX0, RY - 120, 0, 110);
      const iText = txt(intro, RX0, RY - 36, 'The agent keeps going;', { size: 64, fill: C.text });
      set(iText, { 'clip-path': iClip.url });
      const iTicks = [0, 1, 2, 3].map((k) => el('rect', { x: lerp(RX0, RX1, (k + 1) / 5) - 3, y: RY - 14, width: 6, height: 28, rx: 2, fill: C.muted2 }, intro));
      const iDot = el('circle', { r: 10, cy: RY, fill: C.accent, filter: glow }, intro);

      // ── full-frame clips ──────────────────────────────────────────────────────────
      const full = FULL.map((c) => {
        const g = el('g', {}, root);
        return { ...c, g, inst: SCENES[c.name].build(el('g', {}, g)) };
      });

      // ── grid ───────────────────────────────────────────────────────────────────────
      const gridG = el('g', {}, root);
      const grid = GRID.map((c) => {
        const [x, y] = cellPos(c.i);
        const cg = el('g', {}, gridG);
        const cl = clipRect(cg, 0, 0, 1000, 560, 10 / CELL);
        const inner = el('g', { 'clip-path': cl.url }, cg);
        const inst = SCENES[c.name].build(inner);
        el('rect', { x: 0.5, y: 0.5, width: 999, height: 559, rx: 10 / CELL, fill: 'none', stroke: C.line2, 'stroke-width': 1.5 }, cg);
        return { ...c, cg, inst, x, y };
      });

      // ── outro ─────────────────────────────────────────────────────────────────────
      const outro = el('g', {}, root);
      const OY = 760, OX0 = 120, OX1 = 1800;
      const oRailBase = el('line', { x1: OX0, x2: OX1, stroke: C.line2, 'stroke-width': 4, 'stroke-linecap': 'round' }, outro);
      const oRail = el('line', { x1: OX0, x2: OX1, stroke: C.accent, 'stroke-width': 4, 'stroke-linecap': 'round', opacity: 0.4 }, outro);
      const oTrail = el('line', { x1: OX0, stroke: C.accent, 'stroke-width': 5, 'stroke-linecap': 'round' }, outro);
      const STX = [600, 960, 1320], ST = ['hooks', 'tests', 'review'];
      const oSt = STX.map((x, i) => {
        const sg = el('g', {}, outro);
        const box = el('rect', { x: x - 12, width: 24, height: 24, rx: 3, fill: C.bg, stroke: C.muted2, 'stroke-width': 2.5 }, sg);
        const lit = el('rect', { x: x - 12, width: 24, height: 24, rx: 3, fill: C.accent, filter: glow }, sg);
        const lb = txt(sg, x, 0, ST[i], { size: 32, anchor: 'middle', fill: C.muted });
        return { x, sg, box, lit, lb };
      });
      const oDot = el('circle', { r: 11, fill: C.accent, filter: glow }, outro);
      // lockup as in assets/header.html: mark + wordmark, vertically centred, measured then centred
      const lockG = el('g', {}, outro);
      const logoG = el('g', {}, lockG);
      logo(logoG, 0, 0, 150);
      const wmG = el('g', {}, lockG);
      wordmark(wmG, 171, 129, 150);
      const bb = lockG.getBBox();
      set(lockG, { transform: `translate(${960 - (bb.x + bb.width / 2)},${400 - (bb.y + bb.height / 2)})` });
      const tag = el('text', { x: 960, y: 590, 'font-family': MONO, 'font-size': 36, 'text-anchor': 'middle', fill: C.muted, style: 'white-space:pre' }, outro);
      tag.innerHTML = `The agent keeps going; <tspan fill="${C.text}">the rails keep it honest.</tspan>`;

      const on = (t, a, b) => t >= a && t < b;

      return {
        seek(t) {
          // intro (0–1): linear rail draw on the beat grid, the tip writes the line
          show(intro, on(t, 0, 1.0));
          if (on(t, 0, 1.0)) {
            const u = linear(prog(t, 0.05, 0.95));
            const x = lerp(RX0, RX1, u);
            set(iRail, { x2: x });
            set(iClip.rect, { width: Math.max(0, x - RX0) });
            set(iDot, { cx: x, opacity: prog(t, 0, 0.06) });
            iTicks.forEach((tk, k) => set(tk, { fill: x >= +tk.getAttribute('x') ? C.accent : C.muted2 }));
          }

          // full-frame clips with a slow push-in
          for (const c of full) {
            const vis = on(t, c.a, c.b);
            show(c.g, vis);
            if (!vis) continue;
            c.inst.seek(sceneT(c, t));
            const z = S * (1 + 0.035 * prog(t, c.a, c.b));
            set(c.g, { transform: `translate(960,540) scale(${z}) translate(-500,-280)` });
          }

          // grid: cells deal in staggered after the cut, then play in parallel
          const gv = on(t, 4.0, 9.0);
          show(gridG, gv);
          if (gv) for (const c of grid) {
            const u = arrive(prog(t, 4.0 + c.i * 0.08, 4.45 + c.i * 0.08));
            c.inst.seek(sceneT(c, t));
            const s = CELL * lerp(0.94, 1, u);
            const cx = c.x + 500 * CELL, cy = c.y + 280 * CELL + (1 - u) * 24;
            set(c.cg, { opacity: u, transform: `translate(${cx},${cy}) scale(${s}) translate(-500,-280)` });
          }

          // outro (13–15)
          const ov = on(t, 13.0, DUR + 1);
          show(outro, ov);
          if (ov) {
            // the rail carries over from the last clip's rail position and glides into place
            const fromY = 540 + (470 - 280) * S * 1.035;
            const y = lerp(fromY, OY, arrive(prog(t, 13.0, 13.45)));
            set(oRailBase, { y1: y, y2: y }); set(oRail, { y1: y, y2: y });
            const dx = lerp(240, 240 + 720 * 2.0, prog(t, 13.0, 15.0)); // 720 px/s → stations on 13.5 / 14.0 / 14.5
            set(oTrail, { x2: dx, y1: y, y2: y });
            set(oDot, { cx: dx, cy: y });
            oSt.forEach((s, i) => {
              const ap = arrive(prog(t, 13.1 + i * 0.06, 13.45 + i * 0.06));
              const litU = clamp((dx - s.x) / 16);
              const pulse = 1 + 0.45 * (1 - arrive(clamp((dx - s.x) / 200))) * (litU > 0 ? 1 : 0);
              set(s.box, { y: y - 12 }); set(s.lit, { y: y - 12, opacity: litU });
              set(s.lb, { y: y + 62, fill: litU > 0.5 ? C.accent : C.muted });
              set(s.sg, { opacity: ap, transform: `translate(${s.x},${y}) scale(${pulse}) translate(${-s.x},${-y})` });
            });
            const lu = arrive(prog(t, 13.05, 13.5)), wu = arrive(prog(t, 13.15, 13.6));
            set(logoG, { opacity: lu, transform: `translate(0,${(1 - lu) * 30})` });
            set(wmG, { opacity: wu, transform: `translate(0,${(1 - wu) * 30})` });
            const tu = arrive(prog(t, 14.0, 14.4));
            set(tag, { opacity: tu, transform: `translate(0,${(1 - tu) * 16})` });
          }
        },
      };
    },
  };

  // Boot (same contract as the scenes: seek(t) only).
  const stage = document.getElementById('stage');
  const R = REEL.build(el('g', {}, stage));
  window.SCENE = { name: 'showreel', w: W, h: H, dur: DUR, loop: false, poster: REEL.poster, cuts: CUTS };
  window.seek = (t) => R.seek(t);
  window.renderAudio = () => renderSoundtrack(REEL.cues(), DUR, REEL.bpm);
  window.CUES = () => REEL.cues();
  const q = new URLSearchParams(location.search);
  if (q.has('render') || q.has('t')) { window.seek(+q.get('t') || 0); return; }
  const t0 = performance.now();
  const loop = () => { window.seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  loop();
})();

</script>
</body>
