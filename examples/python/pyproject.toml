[project]
name = "slickrails-example-python"
version = "0.1.0"
description = "A tiny project set up with slickrails: one function, one test, one feature dossier."
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
