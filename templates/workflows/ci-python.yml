# slickrails: CI for Python projects
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: slickrails setup
        # fails when the guardrails (git hooks, checks in config.sh, agent session hooks) are missing or empty;
        # repository variable SLICKRAILS_SETUP_CHECK=warn reports only, =off skips
        env:
          SLICKRAILS_SETUP_CHECK: ${{ vars.SLICKRAILS_SETUP_CHECK }}
        run: sh .slickrails/setup-check.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" 2>/dev/null || pip install -e . || true; fi
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: |
          if ls tests/ test_*.py */test_*.py >/dev/null 2>&1 || [ -d tests ]; then
            pytest -q
          else
            echo "No tests found — rule 10: record this as a gap in .slickrails/STATUS.md."
            exit 1
          fi
