# slickrails: CI for Ruby projects
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Tests
        run: |
          if [ -d spec ]; then bundle exec rspec
          elif [ -d test ]; then bundle exec rake test
          else
            echo "No tests found — rule 10: record this as a gap in .slickrails/STATUS.md."
            exit 1
          fi
