# slickrails: CI for Ruby projects
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: slickrails setup
        # fails when the guardrails (git hooks, checks in config.sh, agent session hooks) are missing or empty;
        # repository variable SLICKRAILS_SETUP_CHECK=warn reports only, =off skips
        env:
          SLICKRAILS_SETUP_CHECK: ${{ vars.SLICKRAILS_SETUP_CHECK }}
        run: sh .slickrails/setup-check.sh

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Tests
        run: |
          if [ -d spec ]; then bundle exec rspec
          elif [ -d test ]; then bundle exec rake test
          else
            echo "No tests found — rule 10: record this as a gap in .slickrails/STATUS.md."
            exit 1
          fi
