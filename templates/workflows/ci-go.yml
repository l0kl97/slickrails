# slickrails: CI for Go projects
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: slickrails setup
        # fails when the guardrails (git hooks, checks in config.sh, agent session hooks) are missing or empty;
        # repository variable SLICKRAILS_SETUP_CHECK=warn reports only, =off skips
        env:
          SLICKRAILS_SETUP_CHECK: ${{ vars.SLICKRAILS_SETUP_CHECK }}
        run: sh .slickrails/setup-check.sh

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./...
