# slickrails: CI for JVM projects (Maven or Gradle)
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: slickrails setup
        # fails when the guardrails (git hooks, checks in config.sh, agent session hooks) are missing or empty;
        # repository variable SLICKRAILS_SETUP_CHECK=warn reports only, =off skips
        env:
          SLICKRAILS_SETUP_CHECK: ${{ vars.SLICKRAILS_SETUP_CHECK }}
        run: sh .slickrails/setup-check.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: ${{ hashFiles('pom.xml') != '' && 'maven' || 'gradle' }}

      - name: Tests
        run: |
          if [ -f pom.xml ]; then mvn -q test
          elif [ -x gradlew ]; then ./gradlew test
          else gradle test; fi
